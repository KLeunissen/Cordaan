<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/waste-warrior-design-system-7908025b-0e2e-433d-98e3-e76490f174df/colors_and_type.css">
<script src="_ds/waste-warrior-design-system-7908025b-0e2e-433d-98e3-e76490f174df/_ds_bundle.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: oklch(0.18 0.02 190); }
  * { -webkit-tap-highlight-color: transparent; }
  a { color: var(--primary); }
  a:hover { color: var(--secondary); }
</style>
</helmet>
<div class="contrast" style="min-height: 100vh; max-width: 430px; margin: 0 auto; background: var(--background); color: var(--foreground); font-family: Asap, sans-serif; padding: 0 0 28px; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px 12px;">
    <a href="Cook-a-long mobiel.dc.html" style="flex: 0 0 40px; width: 40px; height: 40px; border-radius: var(--radius-pill); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--primary); font-size: 19px;">←</a>
    <span style="flex: 1; min-width: 0;">
      <span style="display: block; font-size: 13px; opacity: 0.7;">Cook-a-long</span>
      <span style="display: block; font-size: 15px; opacity: 0.7;">{{ dayLabel }}</span>
    </span>
  </div>

  <div style="padding: 0 16px 14px;">
    <div style="font-family: 'Asap Condensed', sans-serif; font-weight: 700; font-size: 32px; line-height: 1.05; letter-spacing: -0.01em; text-wrap: pretty;">{{ dish }}</div>
    <div style="font-size: 16px; opacity: 0.7; padding-top: 4px;">{{ portionsLine }}</div>
  </div>

  <sc-if value="{{ hasVideo }}" hint-placeholder-val="{{ true }}">
    <div style="padding: 0 16px;">
      <div style="border-radius: 20px; overflow: hidden; background: oklch(0.18 0.02 190); display: flex;">
        <video ref="{{ videoRef }}" src="{{ videoSrc }}" controls="{{ true }}" autoPlay="{{ true }}" playsInline="{{ true }}" preload="auto" style="width: 100%; max-height: 68vh; display: block; background: oklch(0.18 0.02 190);"></video>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ noVideo }}" hint-placeholder-val="{{ false }}">
    <div style="padding: 0 16px;">
      <div style="border: 1px solid var(--border); border-radius: 20px; background: var(--card); padding: 18px; font-size: 16px; opacity: 0.8; text-wrap: pretty;">Voor dit gerecht staat nog geen cook-a-long klaar. Kip tikka masala heeft er wel een.</div>
    </div>
  </sc-if>

  <div style="padding: 16px; display: flex; flex-direction: column; gap: 10px;">
    <a href="Cook-a-long mobiel.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; background: var(--primary); color: var(--primary-foreground); border-radius: 18px; padding: 12px 14px 12px 18px; min-height: 62px; box-sizing: border-box;">
      <span style="flex: 1; min-width: 0;">
        <span style="display: block; font-family: 'Asap Condensed', sans-serif; font-weight: 700; font-size: 22px; line-height: 1.15;">Terug naar de stappen</span>
        <span style="display: block; font-size: 14px; opacity: 0.85;">Mise en place en hoeveelheden</span>
      </span>
      <span style="flex: 0 0 44px; width: 44px; height: 44px; border-radius: var(--radius-pill); background: var(--primary-foreground); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 21px;">→</span>
    </a>
    <div style="font-size: 14px; opacity: 0.6; text-wrap: pretty; padding: 0 4px;">Je kijkpositie wordt bewaard, dus je kunt tussendoor terug naar de stappen.</div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:900},&quot;dayIndex&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:0,&quot;max&quot;:6,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Cook-a-long&quot;}}">
const KEY_DAYS = "ww-order-days-v3";
const KEY_PEOPLE = "ww-weekmenu-people";
const KEY_POS = "ww-cookalong-pos";

const DAYS = [
  { day: "Maandag", date: "24 aug" }, { day: "Dinsdag", date: "25 aug" },
  { day: "Woensdag", date: "26 aug" }, { day: "Donderdag", date: "27 aug" },
  { day: "Vrijdag", date: "28 aug" }, { day: "Zaterdag", date: "29 aug" },
  { day: "Zondag", date: "30 aug" }
];

const VIDEOS = {
  "Kip tikka masala": "assets/cook-a-long-kip-tikka-masala.mp4"
};

const PEOPLE_FALLBACK = [
  "Bram Kuiper", "Daan Vermeulen", "Fleur van Dijk", "Guus Lammers",
  "Hanna Peters", "Ilse Hoekstra", "Marit Jansen", "Noor el Amrani",
  "Ravi Nandram", "Sanne de Wit", "Tim Oosterhuis", "Youssef Bakker"
];

const DAYS_FALLBACK = [
  { dish: "Gehaktbal met jus", off: [], extras: [] },
  { dish: "Sucadelapje met jus", off: ["Hanna Peters"], extras: [] },
  { dish: "Gestoofde vis met saus", off: ["Guus Lammers", "Tim Oosterhuis"], extras: [] },
  { dish: "Kip tikka masala", off: [], extras: ["Wies (dochter Marit)"] },
  { dish: "Gebakken kibbeling met saus", off: ["Noor el Amrani"], extras: [] },
  { dish: null, off: [], extras: [] },
  { dish: null, off: [], extras: [] }
];

class Component extends DCLogic {
  state = { days: null, people: null };
  video = null;

  componentDidMount() {
    try {
      const days = JSON.parse(localStorage.getItem(KEY_DAYS) || "null");
      const people = JSON.parse(localStorage.getItem(KEY_PEOPLE) || "null");
      const next = {};
      if (Array.isArray(days) && days.length === 7 && days[0] && "dish" in days[0]) next.days = days;
      if (Array.isArray(people) && people.length) next.people = people;
      this.setState(next);
    } catch (e) {}
  }

  videoRef = (el) => {
    if (!el || el === this.video) return;
    this.video = el;
    try {
      const pos = parseFloat(localStorage.getItem(KEY_POS) || "0");
      if (pos > 1) el.currentTime = pos;
    } catch (e) {}
    el.addEventListener("timeupdate", () => {
      try { localStorage.setItem(KEY_POS, String(el.currentTime)); } catch (e) {}
    });
    const p = el.play();
    if (p && p.catch) p.catch(() => {});
  };

  idx() {
    const p = this.props.dayIndex;
    if (p != null) return Math.max(0, Math.min(6, p));
    const days = this.state.days || DAYS_FALLBACK;
    const t = days.findIndex(d => d && VIDEOS[d.dish]);
    return t >= 0 ? t : 3;
  }

  renderVals() {
    const idx = this.idx();
    const days = this.state.days || DAYS_FALLBACK;
    const people = this.state.people || PEOPLE_FALLBACK;
    const d = days[idx] || { dish: null, off: [], extras: [] };
    const s = DAYS[idx];
    const portions = d.dish
      ? people.filter(n => (d.off || []).indexOf(n) === -1).length + (d.extras || []).length
      : 0;

    return {
      dayLabel: s.day + " " + s.date,
      dish: d.dish || "Nog geen gerecht gekozen",
      portionsLine: portions ? portions + " porties · Woongroep 3" : "Kies eerst een gerecht voor deze dag.",
      hasVideo: !!VIDEOS[d.dish],
      noVideo: !VIDEOS[d.dish],
      videoSrc: VIDEOS[d.dish] || "",
      videoRef: this.videoRef
    };
  }
}
</script>
</body>
</html>
